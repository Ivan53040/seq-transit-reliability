name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SeqTransit.slnx
      - run: dotnet build SeqTransit.slnx --no-restore -c Release
      # Fail the build when any NuGet package, direct or transitive, has a published advisory.
      - name: Check NuGet packages for known vulnerabilities
        run: |
          dotnet list SeqTransit.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -E '^\s+>' vulnerable.txt; then echo '::error::Vulnerable NuGet packages found'; exit 1; fi
      # Includes the PostgreSQL integration tests; GitHub's Ubuntu runners have Docker.
      - run: dotnet test SeqTransit.slnx --no-build -c Release --logger "console;verbosity=normal"

  infra:
    name: CDK type-check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      # Exercise the real entrypoint offline; assertions alone do not catch missing app files.
      - name: Synthesize the application and GitHub stacks offline
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: ap-southeast-2
          SEQ_DB_HOST: example.cluster-test.ap-southeast-2.rds.amazonaws.com
          SEQ_DB_CLUSTER_RESOURCE_ID: cluster-TESTRESOURCEID
          SEQ_GITHUB_REPOSITORY: Ivan53040/seq-transit-reliability
        run: |
          mkdir -p ../artifacts/ingestion ../artifacts/api ../web/dist
          touch ../artifacts/ingestion/placeholder ../artifacts/api/placeholder ../web/dist/placeholder
          npx cdk synth SeqTransitStack --quiet --no-lookups
          npx cdk --app "npx tsx bin/github.ts" synth SeqTransitGitHubStack --quiet --no-lookups

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  # Runs only on main, after every check passes, and only once the repository variable
  # AWS_DEPLOY_ROLE_ARN exists (see README, "Deploy from GitHub Actions").
  deploy:
    name: Deploy to AWS
    needs: [dotnet, infra, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      SEQ_DB_HOST: ${{ vars.SEQ_DB_HOST }}
      SEQ_DB_CLUSTER_RESOURCE_ID: ${{ vars.SEQ_DB_CLUSTER_RESOURCE_ID }}
      SEQ_ALERT_EMAIL: ${{ vars.SEQ_ALERT_EMAIL }}
      SEQ_MONTHLY_BUDGET_USD: ${{ vars.SEQ_MONTHLY_BUDGET_USD }}
      SEQ_LOAD_INTERVAL_MINUTES: ${{ vars.SEQ_LOAD_INTERVAL_MINUTES }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Build Lambda packages and dashboard
        run: bash ./scripts/publish.sh
      - name: Apply database migrations
        run: dotnet run --project src/SeqTransit.Migrator -c Release
        env:
          DB_HOST: ${{ vars.SEQ_DB_HOST }}
          DB_USER: postgres
      - name: Deploy stack
        working-directory: infra
        run: |
          npm ci
          npx cdk deploy SeqTransitStack --require-approval never
