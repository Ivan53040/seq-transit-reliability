name: Sync Static GTFS Timetable

on:
  schedule:
    # Mondays at 03:00 Brisbane time (Sunday 17:00 UTC), ahead of peak service and the 07:00 weekly summary.
    - cron: '0 17 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-gtfs
  cancel-in-progress: false

jobs:
  sync-gtfs:
    name: Download SEQ_GTFS.zip and swap into Aurora
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-2
      DB_HOST: ${{ vars.SEQ_DB_HOST }}
      # The ingest role can replace the gtfs_* tables but cannot change the schema.
      DB_USER: seq_ingest
      DB_NAME: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Download latest Translink SEQ static GTFS
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            -o /tmp/SEQ_GTFS.zip \
            https://gtfsrt.api.translink.com.au/GTFS/SEQ_GTFS.zip
          ls -lh /tmp/SEQ_GTFS.zip
      - name: Atomic table swap into Aurora PostgreSQL
        run: dotnet run --project src/SeqTransit.Local -c Release -- load-gtfs /tmp/SEQ_GTFS.zip
